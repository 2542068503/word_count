<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#0071E3" />
      <stop offset="100%" stop-color="#0058A8" />
    </linearGradient>
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F2F2F7" />
    </linearGradient>
    <filter id="appleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Apple iOS Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#appleGradient)" />

  <!-- Document Silhouette -->
  <g filter="url(#appleShadow)" transform="translate(106, 96)">
    <!-- Document Card -->
    <path d="M 0 24 C 0 10.75 10.75 0 24 0 L 190 0 L 300 110 L 300 296 C 300 309.25 289.25 320 276 320 L 24 320 C 10.75 320 0 309.25 0 296 Z" fill="url(#docGradient)" />
    <!-- Fold Corner -->
    <path d="M 190 0 L 190 86 C 190 99.25 200.75 110 214 110 L 300 110 Z" fill="#D1D1D6" />

    <!-- Content Lines representing words / character counting -->
    <rect x="46" y="146" width="130" height="20" rx="10" fill="#0071E3" />
    <rect x="190" y="146" width="64" height="20" rx="10" fill="#34C759" />

    <rect x="46" y="196" width="208" height="18" rx="9" fill="#8E8E93" />
    <rect x="46" y="240" width="160" height="18" rx="9" fill="#8E8E93" />
  </g>
</svg>
